name: Windows preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'terminal/**'
      - 'playwright/**'
      - 'autosend/**'
      - 'messaging/**'
      - 'execution/**'
      - 'dashboard/**'
      - 'onboarding/**'
      - 'skills/**'
      - 'native/**'
      - '.github/workflows/windows-preview.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'terminal/**'
      - 'playwright/**'
      - 'autosend/**'
      - 'messaging/**'
      - 'execution/**'
      - 'dashboard/**'
      - 'onboarding/**'
      - 'skills/**'
      - 'native/**'
      - '.github/workflows/windows-preview.yml'
permissions:
  contents: read
jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            windows/package-lock.json
            playwright/package-lock.json
      - name: Install Playwright runtime (locked)
        shell: pwsh
        run: npm ci --prefix playwright --ignore-scripts --no-audit --no-fund
      - name: Patch Playwright snapshot timeout
        shell: pwsh
        run: node playwright/patch-playwright.mjs
      - name: Prepare signed-source pinned Windows tools
        shell: pwsh
        run: python windows/prepare-runtime.py
      - name: Install Windows app
        shell: pwsh
        run: npm ci --prefix windows --no-audit --no-fund
      - name: Windows regressions
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -LiteralPath windows/tests -File -Filter '*.test.cjs' | Select-Object -ExpandProperty FullName)
          $tests += (Resolve-Path terminal/tests/platform.test.cjs).Path
          node --test $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check windows/app/main.cjs
          node --check windows/app/runtime.cjs
          node --check windows/app/preload.cjs
          node --check terminal/stateless_server.js
          node --check terminal/interactive_runtime.cjs
      - name: Seven-step wizard browser acceptance (mock IPC)
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (!(Test-Path $chrome)) { throw "Chrome missing from runner" }
          $env:MCPGO_WIZARD_CHROME = $chrome
          node --test windows/tests/onboarding-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble unsigned NSIS preview
        shell: pwsh
        working-directory: windows
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Inspect Windows bundle and checksum
        shell: pwsh
        run: python windows/verify-build.py
      - name: Native Windows smoke tests
        shell: pwsh
        env:
          MCPGO_WINDOWS_RUNTIME_TEST: '1'
        run: node --test windows/tests/native-integration.test.cjs windows/tests/python-runtime.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: McpGo-Windows-unsigned-preview
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 7
